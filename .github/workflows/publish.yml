name: Publish reports to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/news_lens/publish.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single concurrent deployment; cancel an in-flight build if a new
# push arrives.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (no LLM/embeddings extras — index build is pure-Python)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build index
        run: python -m news_lens.publish build docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
